apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: vorgabenui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: loader
          image: git.baumann.gr/adebaumann/vui-data-loader:0.7
          command: [ "sh","-c","cp preload/preload.sqlite3 /data/db.sqlite3; chown -R 999:999 /data; ls -la /data; sleep 10; exit 0" ]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: web
          image: git.baumann.gr/adebaumann/vui:0.931
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: django-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: django
  namespace: vorgabenui
spec:
  type: ClusterIP
  selector:
    app: django
  ports:
    - port: 8000
      targetPort: 8000

