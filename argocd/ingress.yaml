apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django
  namespace: vorgabenui
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: vorgabenportal.knowyoursecurity.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
