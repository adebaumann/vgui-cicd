{% extends "base.html" %}
{% block content %}
 <h1 class="mb-4">Suche</h1>

    <!--  Search form  -->
    <form action="." method="post">
      {% csrf_token %}
      <!-- Search field -->
      <div class="mb-3">
        <label for="query" class="form-label">Suchbegriff</label>
        <input type="text"
               class="form-control"
               id="query"
               name="q"
               placeholder="Suchbegriff eingeben …"
               required>
      </div>
      <button type="submit" class="btn btn-primary">Suchen</button>
    </form>
   {% endblock %}
